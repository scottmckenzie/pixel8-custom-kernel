name: Build Pixel kernel (KernelSU-Next + Droidspaces)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device: shusky = Pixel 8 / 8 Pro, pantah = Pixel 7 / 7 Pro"
        type: choice
        options: [shusky, pantah]
        default: shusky
      manifest_branch:
        description: "Pixel kernel manifest branch (must match the Android release on your phone); blank = android-gs-<device>-6.1-android16"
        required: false
        default: ""
      ksu_ref:
        description: "KernelSU-Next setup.sh argument: blank = latest release, or dev / stable / vX.Y.Z"
        required: false
        default: ""
      strict_kmi:
        description: "Keep KMI symbol-list strict mode (untick if the build fails on KMI/ABI checks)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # Per-device values, taken from private/devices/google/<device>/BUILD.bazel.
      - name: Resolve device settings
        run: |
          case "${{ inputs.device }}" in
            shusky) SOC=zuma ;;
            pantah) SOC=gs201 ;;
            *) echo "Unknown device: ${{ inputs.device }}"; exit 1 ;;
          esac
          BRANCH="${{ inputs.manifest_branch }}"
          [ -n "$BRANCH" ] || BRANCH="android-gs-${{ inputs.device }}-6.1-android16"
          {
            echo "DEVICE=${{ inputs.device }}"
            echo "MANIFEST_BRANCH=$BRANCH"
            echo "DIST_TARGET=//private/devices/google/${{ inputs.device }}:${SOC}_${{ inputs.device }}_dist"
            echo "DIST_DIR=kernel/out/${{ inputs.device }}/dist"
          } | tee -a "$GITHUB_ENV"

      # Free runners only have ~14 GB free; this merges / and /mnt into one big volume.
      # Must run BEFORE checkout because it remounts the workspace.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout this repo (configs + patches)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 rsync
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          # Ubuntu 24.04 blocks unprivileged user namespaces, which breaks Bazel's sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h "$GITHUB_WORKSPACE"

      - name: Sync Pixel kernel source
        run: |
          mkdir -p kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_BRANCH"
          for i in 1 2 3; do
            repo sync -c --no-tags --no-clone-bundle -j"$(nproc)" && break
            echo "repo sync failed (attempt $i), retrying..."; sleep 30
          done
          ls
          echo "---- device.bazelrc files ----"
          find private -name device.bazelrc -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;

      - name: Apply extra patches (e.g. Droidspaces GKI SYSVIPC kABI fix)
        run: |
          cd kernel/aosp
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/overlay/patches/*.patch; do
            echo "Applying $(basename "$p")"
            patch -p1 --forward < "$p"
          done

      - name: Add KernelSU-Next
        run: |
          cd kernel/aosp
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s ${{ inputs.ksu_ref }}

      - name: Apply Droidspaces + KSU config to gki_defconfig
        run: |
          DEFCONFIG=kernel/aosp/arch/arm64/configs/gki_defconfig
          {
            echo ""
            echo "# ---- KernelSU-Next ----"
            echo "CONFIG_KSU=y"
            echo "# ---- Droidspaces ----"
            grep -v '^\s*$' "$GITHUB_WORKSPACE/overlay/configs/droidspaces.config"
          } >> "$DEFCONFIG"
          tail -n 60 "$DEFCONFIG"
          # GKI's check_defconfig runs savedefconfig and fails if gki_defconfig isn't
          # byte-for-byte canonical, which appended options never are. Disable it.
          sed -i 's/check_defconfig//' kernel/aosp/build.config.gki
          grep -n "POST_DEFCONFIG_CMDS" kernel/aosp/build.config.gki || true

      - name: Build (Kleaf)
        run: |
          cd kernel
          EXTRA=""
          if [ "${{ inputs.strict_kmi }}" != "true" ]; then
            EXTRA="--nokmi_symbol_list_strict_mode"
          fi
          tools/bazel run \
            --config="$DEVICE" \
            --config=fast \
            --config=use_source_tree_aosp \
            --download_prebuilt_gki_fips140=false \
            --lto=thin \
            $EXTRA \
            "$DIST_TARGET"
          echo "---- dist output ----"
          ls -lh "$GITHUB_WORKSPACE/$DIST_DIR"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device }}-kernel-${{ github.run_number }}
          if-no-files-found: error
          path: |
            ${{ env.DIST_DIR }}/boot.img
            ${{ env.DIST_DIR }}/dtbo.img
            ${{ env.DIST_DIR }}/vendor_kernel_boot.img
            ${{ env.DIST_DIR }}/vendor_dlkm.img
            ${{ env.DIST_DIR }}/system_dlkm.img
